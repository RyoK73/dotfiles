# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(~/.config/hypr/scripts/terminal-cwd.sh)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-webapp "https://claude.ai/new"
bindd = SUPER SHIFT, G, Github, exec, omarchy-launch-webapp "https://github.com/RyoK73"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
# ウィンドウの上下切り替え
bindd = SUPER,Y,Toggle window split,layoutmsg,togglesplit

## デフォルトのバインドを解除
unbind = SUPER,H
unbind = SUPER,J
unbind = SUPER,K
unbind = SUPER,L
unbind = SUPER,N
unbind = SUPER,TAB
unbind = SUPER SHIFT,TAB

unbind = SUPER,SHIFT,H
unbind = SUPER,SHIFT,J
unbind = SUPER,SHIFT,K
unbind = SUPER,SHIFT,L
unbind = SUPER SHIFT,code:10
unbind = SUPER SHIFT,code:11
unbind = SUPER SHIFT,code:12
unbind = SUPER SHIFT,code:13
unbind = SUPER SHIFT,code:14
unbind = SUPER SHIFT,code:15
unbind = SUPER SHIFT,code:16
unbind = SUPER SHIFT,code:17
unbind = SUPER SHIFT,code:18

unbind = SUPER CTRL,H
unbind = SUPER CTRL,J
unbind = SUPER CTRL,K
unbind = SUPER CTRL,L
unbind = SUPER CTRL,N
unbind = SUPER CTRL,M
unbind = SUPER CTRL,J
unbind = SUPER CTRL,W
unbind = SUPER CTRL,code:10
unbind = SUPER CTRL,code:11
unbind = SUPER CTRL,code:12
unbind = SUPER CTRL,code:13
unbind = SUPER CTRL,code:14
unbind = SUPER CTRL,code:15
unbind = SUPER CTRL,code:16
unbind = SUPER CTRL,code:17
unbind = SUPER CTRL,code:18

## hjklでウィンドウ移動
### window移動
bind = SUPER,H,movefocus,l
bind = SUPER,J,movefocus,d
bind = SUPER,K,movefocus,u
bind = SUPER,L,movefocus,r

## window位置変更
bind = SUPER CTRL,H,swapwindow,l
bind = SUPER CTRL,J,swapwindow,d
bind = SUPER CTRL,K,swapwindow,u
bind = SUPER CTRL,L,swapwindow,r

## windowをワークスペース1〜9へ移動
bind = SUPER CTRL,code:10,movetoworkspace,1
bind = SUPER CTRL,code:11,movetoworkspace,2
bind = SUPER CTRL,code:12,movetoworkspace,3
bind = SUPER CTRL,code:13,movetoworkspace,4
bind = SUPER CTRL,code:14,movetoworkspace,5
bind = SUPER CTRL,code:15,movetoworkspace,6
bind = SUPER CTRL,code:16,movetoworkspace,7
bind = SUPER CTRL,code:17,movetoworkspace,8
bind = SUPER CTRL,code:18,movetoworkspace,9

# キーバインド確認
bind = SUPER ALT,K,exec,omarchy-menu-keybindings

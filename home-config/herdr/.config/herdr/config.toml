onboarding = false

[ui]
pane_borders = "always"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "system"

[ui.sidebar.spaces]
rows = [["$num", "state_icon", "workspace"], ["branch", "git_status"]]

[theme]
[theme.custom]
sidebar_bg = "reset"
active_row_bg = "#535353" # Agent背景色
selection_bg = "#9b9b9b"
panel_bg = "reset"
accent = "#d78b3d"        # 枠・タブの選択色
green = "#00be86"
blue = "#004f95"
red = "#ff555d"
yellow = "#bd9539"
overlay0 = "#ffffff"
overlay1 = "#ffffff"

[keys]
prefix = "super+b"

## pane
split_vertical = "super+shift+enter"
split_horizontal = "super+ctrl+shift+enter"
focus_pane_left = "super+shift+h"
focus_pane_down = "super+shift+j"
focus_pane_up = "super+shift+k"
focus_pane_right = "super+shift+l"
close_pane = "super+shift+w"
swap_pane_left = "super+shift+ctrl+h"
swap_pane_down = "super+shift+ctrl+j"
swap_pane_up = "super+shift+ctrl+k"
swap_pane_right = "super+shift+ctrl+l"

## tab
new_tab = "super+shift+t"
close_tab = "super+shift+x"
next_tab = "super+tab"
previous_tab = "super+shift+tab"
rename_tab = "super+shift+r"

## config
settings = "super+shift+ctrl+s"
help = "super+shift+s"
reload_config = "super+shift+ctrl+c"

## navi
goto = "super+n"

## workspace
new_workspace = "super+shift+n"
switch_workspace = "super+shift+1..9"
